<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrasci</title>
</head>
<body>
    <form>
        <p>
        <label>Ime i rezime:</label>
        <input type="text" name="name" placeholder="Unesite svoje ime i prezime"/>
    </p>
    <p>
        <label>E-mail adresa</label>
        <input type="email" name="email" placeholder="Unesite e-mail adresu"/>
    </p>
    <p>
        <label>Starost</label>
        <input type="number" name="age" placeholder="Unesite koliko imate godina" min="13" max="120" size="20"/>
    </p>
    <label>
        <input type="datetime-local" name="dob" placeholder="Unesite svoj datum rođenja"/>
    </label>
    </form>
</body>
</html>
